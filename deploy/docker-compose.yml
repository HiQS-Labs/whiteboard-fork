services:
  review-hub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: whiteboard-review-hub:latest
    container_name: whiteboard-review-hub
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - REVIEW_HUB_PORT=8787
      - REVIEW_HUB_HOST=0.0.0.0
      - REVIEW_HUB_ORIGIN=${REVIEW_HUB_ORIGIN:-http://localhost:8787}
      - REVIEW_HUB_TOKEN=${REVIEW_HUB_TOKEN:?set REVIEW_HUB_TOKEN}
      - REVIEW_HUB_USER=${REVIEW_HUB_USER:?set REVIEW_HUB_USER}
      - REVIEW_HUB_PASSWORD=${REVIEW_HUB_PASSWORD:?set REVIEW_HUB_PASSWORD}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - review-hub-data:/data

volumes:
  review-hub-data:
